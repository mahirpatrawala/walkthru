<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#eef0f3" />
    <link rel="icon" href="data:," />
    <title>walkthru</title>
    <link rel="stylesheet" href="/src/buyer/buyer.css" />
    <!-- first paint before any script has run: removed by createLoadingScreen (src/buyer/loading.ts) -->
    <style>
      #wt-boot { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #eef0f3; color: #1a1a1a; font: 600 24px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #wt-boot i { display: block; width: 120px; height: 6px; border-radius: 3px; background: #d9dde4; overflow: hidden; position: relative; }
      #wt-boot i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: #2f6bff; animation: wt-boot 1.1s ease-in-out infinite; }
      @keyframes wt-boot { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="wt-boot" role="status" aria-label="Loading">walkthru<i></i></div>
    <div id="app"></div>
    <noscript>walkthru needs JavaScript.</noscript>
    <script type="module" src="/src/buyer/main.ts"></script>
  </body>
</html>
