<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#F7F0E4" />
    <meta name="description" content="Walk through a flat before you visit it. walkthru turns an Indian flat's drawings into a 3D home you can walk through, with sizes from the floor plan." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 15.2 16 4.6l12 10.6V27a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 27z' fill='%23B2472B'/%3E%3Cpath d='M12.5 28.4V17.2a3.5 3.5 0 0 1 7 0v11.2z' fill='%23FFFDF8'/%3E%3Cpath d='M16 28.4V14.6l5.4 1.4v12.4z' fill='%23E3A33A'/%3E%3C/svg%3E" />
    <!-- display face: Bricolage Grotesque (Google Fonts, swap so text shows at once in the system font and settles when it arrives) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" /></noscript>
    <title>walkthru</title>
    <link rel="stylesheet" href="/src/buyer/buyer.css" />
    <!-- first paint before any script has run: removed by createLoadingScreen (src/buyer/loading.ts) -->
    <style>
      #wt-boot { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #F7F0E4; color: #2B211C; font: 800 28px/1 'Bricolage Grotesque', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: -0.02em; }
      #wt-boot i { display: block; width: 120px; height: 6px; border-radius: 3px; background: #E4D8C6; overflow: hidden; position: relative; }
      #wt-boot i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #E3A33A, #B2472B); animation: wt-boot 1.1s ease-in-out infinite; }
      @keyframes wt-boot { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
  </head>
  <body>
    <div id="wt-boot" role="status" aria-label="Loading">walkthru<i></i></div>
    <div id="app"></div>
    <noscript>walkthru needs JavaScript.</noscript>
    <script type="module" src="/src/buyer/entry.ts"></script>
  </body>
</html>
