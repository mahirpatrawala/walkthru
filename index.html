    <!-- first paint before any script has run: removed by createLoadingScreen (src/buyer/loading.ts) -->
    <style>
      #wt-boot { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(900px 520px at 50% 40%, #2A211C 0%, #17110E 100%); color: #FFFDF8; font: 800 28px/1 'Bricolage Grotesque', 'Avenir Next', 'Trebuchet MS', system-ui, sans-serif; letter-spacing: -0.02em; }
      #wt-boot i { display: block; width: 120px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.16); overflow: hidden; position: relative; }
      #wt-boot i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #E3A33A, #B2472B); animation: wt-boot 1.1s ease-in-out infinite; }
      #wt-boot.is-light { background: #F7F0E4; color: #2B211C; }
      #wt-boot.is-light i { background: #E4D8C6; }
      @keyframes wt-boot { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
    <!-- Vercel Web Analytics (cookieless page views). Only on the deployed site, so local runs stay quiet. -->
    <script>
      if (!/^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname)) {
