<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>walkthru gym, lobby and hall contact sheet</title>
<!--
  Not a build input. `npx vite`, then /gym-demo.html?cat=cardio|strength|freeweights|studio|amenities|reception|decor|stage|games|seating|tables  (or ?place=gym|lobby|hall).
  Every piece of that category at its real size on a floor with a 50 cm grid, a 175 cm stand-in beside each (the scale), through the same builder the app uses.
  ?tier=low|medium|high  ?cols=5  ?cell=3.4  ?cam=x,y,z,tx,ty,tz  ?ids=a,b  ?person=0 (no stand-in)  ?side=1 (the camera on the right)  window.__demo.done resolves when drawn.
-->
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6e0; font: 12px system-ui; } #app { position: fixed; inset: 0; }</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { CATALOG, itemFromCatalog } from '/src/core/catalog.ts';
import { categoryOf, CATEGORIES } from '/src/core/pieces.ts';
import { buildFurnitureMesh, setFurnitureDefaults } from '/src/engine/furniture.ts';
import { furnitureKit } from '/src/look/furniture-materials.ts';
import { setStyle } from '/src/look/style.ts';
import { setGenCeiling } from '/src/look/gen/ceiling.ts';

const q = new URLSearchParams(location.search);
const cat = q.get('cat');
const tier = q.get('tier') || 'high';
const ceiling = parseFloat(q.get('ceiling') || '2.7');
setGenCeiling(ceiling);
setStyle({ packId: q.get('pack') || 'light-scandinavian' });
setFurnitureDefaults({ style: 'real', tier });
await furnitureKit.setTier(tier);
const ids = q.get('ids')?.split(',');
const place = q.get('place');
const rows = CATALOG.filter((c) => (ids ? ids.includes(c.id) : cat ? categoryOf(c.id) === cat : place ? c.places?.includes(place) : true)).filter((c) => categoryOf(c.id) !== undefined);
if (ids) rows.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
const cols = parseInt(q.get('cols') || String(Math.ceil(Math.sqrt(rows.length * 1.3))));

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e6e0');
scene.add(new THREE.HemisphereLight('#ffffff', '#b9b2a6', 1.2));
const sun = new THREE.DirectionalLight('#fff3e0', 2.6);
sun.position.set(-3, 8, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 30 });
scene.add(sun);

function label(text) {
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  g.font = '600 30px system-ui'; const w = Math.ceil(g.measureText(text).width) + 24; c.width = w; c.height = 46;
  g.font = '600 30px system-ui'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, 46); g.fillStyle = '#222'; g.textBaseline = 'middle'; g.fillText(text, 12, 24);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(w / 46 * 0.16, 0.16, 1); s.renderOrder = 10; return s;
}

const cell = parseFloat(q.get('cell') || '3.4');
const rowsN = Math.ceil(rows.length / cols);
const W = cols * cell, D = rowsN * cell;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W + 4, D + 4), new THREE.MeshStandardMaterial({ color: '#d9d3c7', roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(W / 2 - cell / 2, 0, D / 2 - cell / 2); floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(Math.max(W, D) + 4, (Math.max(W, D) + 4) * 2, '#a49d90', '#c4bdb0'); grid.position.set(W / 2 - cell / 2, 0.002, D / 2 - cell / 2); scene.add(grid);

rows.forEach((c, i) => {
  const x = (i % cols) * cell, z = Math.floor(i / cols) * cell;
  const item = itemFromCatalog(c.id, { cx: x, cz: z, w: c.footprint.w, d: c.footprint.d, yawDeg: 0 }, 'virtual');
  const g = buildFurnitureMesh(item);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(g);
  const l = label(c.name); l.position.set(x, 0.05, z + c.footprint.d / 2 + 0.25); scene.add(l);
  if (q.get('person') !== '0') scene.add(mannequin(x - c.footprint.w / 2 - 0.45, z + c.footprint.d / 2 - 0.2));
});
// a 175 cm stand-in (the scale): legs, torso, arms, head, in one colour
function mannequin(x, z) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: '#E07B39', roughness: 0.7 });
  const add = (geo, px, py, pz) => { const m = new THREE.Mesh(geo, mat); m.position.set(px, py, pz); m.castShadow = true; g.add(m); return m; };
  const H = 1.75;
  for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.06, 0.05, 0.86, 10), s * 0.09, 0.43, 0);
  add(new THREE.BoxGeometry(0.34, 0.55, 0.2), 0, 0.86 + 0.275, 0);
  for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.04, 0.035, 0.6, 8), s * 0.22, 1.12, 0);
  add(new THREE.SphereGeometry(0.1, 14, 10), 0, H - 0.1, 0);
  add(new THREE.CylinderGeometry(0.045, 0.045, 0.08, 8), 0, H - 0.2, 0);
  g.position.set(x, 0, z); g.rotation.y = Math.PI * 0.15;
  return g;
}

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
const cx = W / 2 - cell / 2, cz = D / 2 - cell / 2;
const slant = q.get('side') === '1' ? 1 : 0;
const zoom = parseFloat(q.get('zoom') || '0.62');
const span = Math.max(W, D * 1.4) * zoom;
camera.position.set(cx + slant * span * 0.5, span * 0.62, cz + span * 0.85);
camera.lookAt(cx, 0.7, cz + D * 0.05);
const cam = q.get('cam')?.split(',').map(Number);
if (cam?.length === 6) { camera.position.set(cam[0], cam[1], cam[2]); camera.lookAt(cam[3], cam[4], cam[5]); }
const tileMode = q.get('mode') === 'tiles';
const views = (q.get('views') || 'front,back').split(',');
const tileCols = parseInt(q.get('tc') || String(Math.min(rows.length, 4)));
function tileDraw() {
  // one tile per piece and view: a camera round that piece, at a distance that frames it; the 175 cm stand-in is in the scene beside it
  const tiles = []; rows.forEach((c) => views.forEach((v) => tiles.push([c, v])));
  const trows = Math.ceil(tiles.length / tileCols);
  const tw = Math.floor(innerWidth / tileCols), th = Math.floor(innerHeight / trows);
  renderer.setScissorTest(true);
  renderer.setClearColor('#e9e6e0');
  tiles.forEach(([c, v], i) => {
    const idx = rows.indexOf(c);
    const x = (idx % cols) * cell, z = Math.floor(idx / cols) * cell;
    const col = i % tileCols, row = Math.floor(i / tileCols);
    const vx = col * tw, vy = innerHeight - (row + 1) * th;
    renderer.setViewport(vx, vy, tw, th); renderer.setScissor(vx, vy, tw, th);
    const cam = new THREE.PerspectiveCamera(32, tw / th, 0.1, 100);
    const m = Math.max(c.footprint.w, c.footprint.d, c.heightM) * 1.0 + 1.4;
    const az = ({ front: 0.55, back: Math.PI + 0.55, side: Math.PI / 2, top: 0.01 }[v] ?? 0.55);
    const hy = v === 'top' ? m * 1.9 : m * 0.55 + 0.4;
    const rr = v === 'top' ? 0.01 : m * 1.55;
    cam.position.set(x + Math.sin(az) * rr, hy, z + Math.cos(az) * rr);
    cam.lookAt(x, Math.min(0.8, c.heightM * 0.45), z);
    renderer.render(scene, cam);
  });
}
function draw() { if (tileMode) tileDraw(); else renderer.render(scene, camera); }
await new Promise((r) => setTimeout(r, 1500));
draw();
window.__demo = { done: Promise.resolve(true), draw, camera, scene, rows: rows.map((r) => r.id) };
</script>
</body>
</html>
